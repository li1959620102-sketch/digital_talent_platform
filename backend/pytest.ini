; =====================================================================
; pytest 配置（2026-10-13 新增）
;
; 背景：项目此前没有任何 pytest 配置文件，也没有覆盖率配置与产物，
; 导致「覆盖率 85%」这一结论缺少可核验的落盘证据。
; 本文件建立测试与覆盖率的标准入口，执行 `pytest` 即自动产出：
;   - 终端覆盖率摘要（含未覆盖行号）
;   - backend/htmlcov/index.html   （HTML 报告，可直接打开查看）
;   - backend/coverage.xml          （CI 可解析格式）
;
; 用法：
;   cd backend
;   pytest                      # 全量 + 覆盖率
;   pytest tests/test_auth.py   # 单文件
;   pytest -m "not slow"        # 排除慢用例
; =====================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 异步用例模式：auto 允许直接写 `async def test_xxx`，无需逐个加 @pytest.mark.asyncio
; （认证服务测试 TestAuthService 的 8 个用例均为 async）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

; 覆盖率：默认只产出报告，不设失败阈值，避免首次运行因阈值导致整体红灯。
; 验收要求覆盖率 ≥80% 时，在 addopts 中追加一行：--cov-fail-under=80
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml

markers =
    slow: 耗时较长的用例（真实 LLM / 外部服务联调）
    integration: 需要真实 MySQL/Redis/Milvus 等外部依赖的用例

; 已知的第三方库弃用告警（不影响功能，保持输出干净便于发现真实告警）
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
