# =====================================================================
# 生产部署覆盖文件（全栈上云 / 单台服务器）
#
# 与本地调试用的 docker-compose.override.yml 互斥：
#   · docker-compose.override.yml 面向「本机 http 调试」——开 DEBUG、端口错开、
#     绑定本地 media 目录、把镜像源钉成国内镜像；这些行为都不该进生产。
#   · 本文件面向「服务器生产部署」——只做一件事：把构建期的依赖源做成可配置，
#     让国内服务器也能稳定构建；其余一律沿用 docker-compose.yml 的生产默认值。
#
# 用法（显式指定 -f 后，docker compose 不会自动加载 override，正好避开本地调试配置）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 注意：两个文件都放在项目根目录，且 -f 顺序必须是「先 docker-compose.yml、后本文件」。
#       这样 project 目录 = 项目根目录，./backend 等相对路径才能正确解析。
# =====================================================================
# ── 日志轮转（全服务生效）─────────────────────────────────────────────────
# Docker 默认的 json-file 驱动不限制单文件大小，日志只增不减。生产机器磁盘有限
# （本次实测 40G，已用 87%），长期运行会把盘写满并导致数据库/服务异常退出。
# 下面这段把每个容器的日志限制在「单文件 20MB × 最多 3 个文件 = 60MB」，
# 9 个服务最坏情况合计约 540MB，超出自动轮转删除最旧的。
#
# 注意：日志驱动是「容器创建时」属性，改完需 `docker compose ... up -d`
#       重建容器才生效（业务数据在命名卷里，不会丢失）。
x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    logging: *log-rotation

  postgres:
    logging: *log-rotation

  redis:
    logging: *log-rotation

  etcd:
    logging: *log-rotation

  minio:
    logging: *log-rotation

  milvus:
    logging: *log-rotation

  ollama:
    # Ollama 打日志最频繁（模型加载/每次推理都有输出），单独收紧到 10MB × 2。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 仅影响「构建期」拉取 Python 包，运行期行为不受影响。
        # 国内服务器建议在 .env 里写：
        #   PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 系统包（tesseract）同样走镜像加速：实测官方源 77KB/s vs 阿里云 557KB/s。
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org}
    logging: *log-rotation

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        # 前端在网关镜像构建阶段用 npm 现装依赖并打包（.dockerignore 排除了 dist/），
        # 国内服务器建议在 .env 里写：
        #   NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}

    # ── HTTPS（已启用形态）───────────────────────────────────────────────
    # 全栈上云默认对外提供 443；80 仅保留 ACME 续期校验与跳转。
    # 证书由 deploy/ 目录的 certbot 流程签发后放入 docker/nginx/ssl/。
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    logging: *log-rotation
